name: Release

# Cut a signed Beep Revival firmware release. Push a tag like `v1.0.0` (or run
# manually), and this builds the shippable images on a GitHub-hosted runner —
# AP1 (AirPlay-1 + Snapcast, the default), AP2 (AirPlay-2, no Snapcast), and
# replaynet (AirPlay-1 + the fresh replaynet multi-room engine, no Snapcast) — signs
# each sysupgrade with the usign OTA key (repo secret BEEP_OTA_SEC), and publishes a
# GitHub Release with the signed + raw sysupgrade images + checksums + pubkey.
# (The first-flash RAM-boot uses the lean initramfs tracked in the repo, not a release
# asset — see the "Assemble release assets" step.)
#
# One-time setup: add the private OTA key as a repo secret named BEEP_OTA_SEC
#   gh secret set BEEP_OTA_SEC < ~/beep-ota-signing/beep-ota.sec
# (Its public half lives in rootfs-overlay/etc/beep-ota.pub and is baked into
# every image, so devices verify the signature before flashing.)
#
# ---------------------------------------------------------------------------
# Job graph (fan-out / fan-in) — built for speed:
#   prepare ─┬─▶ build (ap1) ──────┐
#            ├─▶ build (ap2) ──────┤
#            └─▶ build (replaynet) ┴─▶ release
#
#   * prepare  — builds the OpenWrt cross-toolchain ONCE (cold) and saves the
#                toolchain/staging + downloads cache + a seed ccache, so neither
#                build job cold-builds the toolchain. Exposes the version string.
#   * build    — a matrix over {ap1, ap2, replaynet}; the images compile IN PARALLEL,
#                each restoring the warm caches. ccache (below) makes the packages
#                that build.sh force-`clean`s (ffmpeg/shairport/snapcast/…) recompile
#                from cached objects instead of from scratch.
#   * release  — fans back in: signs every sysupgrade, assembles + publishes.
#
# ccache: OpenWrt's compiler cache (CONFIG_CCACHE=y, needs CONFIG_DEVEL=y for the
# symbol's prompt to survive `make defconfig`). It caches at the compiler-object
# level, so it SURVIVES the `make clean`/`dirclean` that build.sh runs to re-apply
# the big-endian / AAC patches — the exact packages that recompiled every run before.
# CCACHE_DIR is pinned to /build/ccache (outside staging_dir) via CONFIG_CCACHE_DIR
# so it's stable and separately cacheable with its own rolling cache key.
#
# Runner selection (hosted vs self-hosted, one switch, no workflow edit):
#   runs-on = fromJSON(vars.RELEASE_RUNNER) if set, else 'ubuntu-latest'.
#   Point releases at the warm Proxmox build host (minutes instead of ~1-2 h):
#     gh variable set RELEASE_RUNNER --repo <owner>/<repo> \
#       --body '["self-hosted","proxmox","openwrt-builder"]'
#   Clear the variable to fall back to GitHub-hosted runners.
#   On self-hosted, the ephemeral-runner setup (disk reclaim, apt install, /build
#   chown) and ALL actions/cache steps are skipped via `runner.environment` — the CT
#   is pre-provisioned and its /build tree (+ ccache) persist on disk between runs,
#   which is where the speed comes from. NOTE: a single self-hosted runner serializes
#   the ap1/ap2 matrix (register a second runner with its OWN build tree for true
#   parallelism — they must NOT share /build/openwrt).
# ---------------------------------------------------------------------------

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to stamp (e.g. v1.0.0-test); defaults to the run id'
        required: false

permissions:
  contents: write        # create the GitHub Release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # prepare — build the cross-toolchain once (cold) and warm the shared caches.
  # ===========================================================================
  prepare:
    runs-on: ${{ vars.RELEASE_RUNNER && fromJSON(vars.RELEASE_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 180   # first run also builds the toolchain (~45-90 min)
    env:
      CCACHE_DIR: /build/ccache   # pinned outside staging_dir; matches CONFIG_CCACHE_DIR
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Reclaim runner disk (OpenWrt build needs ~25 GB)
        if: ${{ runner.environment == 'github-hosted' }}   # self-hosted CT is pre-provisioned + persistent
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}";
          elif [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}";
          else V="0.0.0+ci.${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Install build dependencies
        if: ${{ runner.environment == 'github-hosted' }}   # pre-installed on the self-hosted CT (no passwordless sudo there)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget time bc quilt cmake ccache

      - name: Prepare build root (/build) — matches the scripts' default paths
        if: ${{ runner.environment == 'github-hosted' }}   # on the CT /build already exists and is owned by the run-user
        run: sudo mkdir -p /build && sudo chown "$(id -u):$(id -g)" /build

      - name: Cache OpenWrt toolchain + downloads
        if: ${{ runner.environment == 'github-hosted' }}   # self-hosted keeps a persistent /build tree — no cache needed
        uses: actions/cache@v4
        with:
          path: |
            /build/openwrt/dl
            /build/openwrt/staging_dir
            /build/openwrt/build_dir/toolchain-*
          key: openwrt-v24.10.0-ath79-${{ hashFiles('scripts/docker-build-setup.sh') }}
          restore-keys: |
            openwrt-v24.10.0-ath79-

      # ccache gets its OWN cache with a ROLLING key (github.run_id), so it updates
      # every run — the toolchain cache above uses a static content key and would
      # never pick up newly-cached compiler objects. This entry seeds the ccache
      # from the toolchain compile; the build jobs restore it and add package objects.
      - name: Cache ccache (seed from toolchain build)
        if: ${{ runner.environment == 'github-hosted' }}   # persistent /build/ccache on the CT
        uses: actions/cache@v4
        with:
          path: /build/ccache
          key: ccache-toolchain-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Set up OpenWrt + build cross-toolchain
        run: |
          set -e
          export FORCE_UNSAFE_CONFIGURE=1
          cd /build
          # Restoring the cache re-creates /build/openwrt/{dl,staging_dir,build_dir},
          # so a bare `[ -d openwrt ]` guard wrongly concludes "already cloned" and
          # skips the clone — leaving scripts/feeds missing (exit 127). Detect a REAL
          # checkout instead, and when cloning, clone into a temp dir and merge it over
          # the cache-restored subdirs so the downloads/toolchain cache is preserved.
          if [ ! -e openwrt/scripts/feeds ]; then
            rm -rf /build/openwrt.src
            git clone --depth 1 -b v24.10.0 https://git.openwrt.org/openwrt/openwrt.git /build/openwrt.src
            mkdir -p openwrt
            cp -a /build/openwrt.src/. openwrt/
            rm -rf /build/openwrt.src
          fi
          cd openwrt
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          cat > .config <<'CFG'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_8dev_carambola2=y
          # ccache: DEVEL=y is required or `make defconfig` drops CONFIG_CCACHE (its
          # menuconfig prompt is gated `if DEVEL`). CCACHE_DIR pinned outside staging_dir.
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/build/ccache"
          CFG
          make defconfig >/dev/null
          # low -j for the toolchain (gcc bootstrap races at high parallelism)
          make -j"$(nproc)" tools/install toolchain/install

  # ===========================================================================
  # build — the single CONVERGED image: AirPlay 1/2 runtime-selectable + replaynet
  # multi-room, no Snapcast. Replaces the old ap1/ap2/replaynet matrix — one firmware
  # now covers all three (protocol + engine chosen at runtime). docs/CONVERGED-IMAGE-DESIGN.md.
  # ===========================================================================
  build:
    needs: prepare
    runs-on: ${{ vars.RELEASE_RUNNER && fromJSON(vars.RELEASE_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 240   # one full image build; toolchain is warm from `prepare`
    env:
      CCACHE_DIR: /build/ccache   # pinned outside staging_dir; matches CONFIG_CCACHE_DIR
    steps:
      - name: Reclaim runner disk (OpenWrt build needs ~25 GB)
        if: ${{ runner.environment == 'github-hosted' }}   # self-hosted CT is pre-provisioned + persistent
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        if: ${{ runner.environment == 'github-hosted' }}   # pre-installed on the self-hosted CT (no passwordless sudo there)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget time bc quilt cmake ccache

      - name: Prepare build root (/build) — matches the scripts' default paths
        if: ${{ runner.environment == 'github-hosted' }}   # on the CT /build already exists and is owned by the run-user
        run: sudo mkdir -p /build && sudo chown "$(id -u):$(id -g)" /build

      # Restore ONLY (never save) the toolchain/staging cache — `prepare` already
      # saved it under this static content key, and two matrix jobs racing to save
      # the same key is pointless. On a warm restore, the toolchain `make` below is a
      # near-no-op, so the build job does NOT cold-rebuild the toolchain.
      - name: Restore OpenWrt toolchain + downloads
        if: ${{ runner.environment == 'github-hosted' }}   # self-hosted uses the persistent /build tree instead
        uses: actions/cache/restore@v4
        with:
          path: |
            /build/openwrt/dl
            /build/openwrt/staging_dir
            /build/openwrt/build_dir/toolchain-*
          key: openwrt-v24.10.0-ath79-${{ hashFiles('scripts/docker-build-setup.sh') }}
          restore-keys: |
            openwrt-v24.10.0-ath79-

      # ccache with a rolling key (github.run_id): restore the newest prior ccache
      # (incl. prepare's toolchain seed) and save a fresh entry at job end.
      - name: Cache ccache
        if: ${{ runner.environment == 'github-hosted' }}   # persistent /build/ccache on the CT
        uses: actions/cache@v4
        with:
          path: /build/ccache
          key: ccache-converged-${{ github.run_id }}
          restore-keys: |
            ccache-converged-
            ccache-

      - name: Set up OpenWrt (toolchain warm from cache — near-no-op)
        run: |
          set -e
          export FORCE_UNSAFE_CONFIGURE=1
          cd /build
          # Same clone-guard as `prepare`: the cache re-creates /build/openwrt/{dl,
          # staging_dir,build_dir} without scripts/feeds, so detect a REAL checkout
          # (openwrt/scripts/feeds) rather than a bare `[ -d openwrt ]`, and merge a
          # fresh clone over the cache-restored subdirs so downloads/toolchain survive.
          if [ ! -e openwrt/scripts/feeds ]; then
            rm -rf /build/openwrt.src
            git clone --depth 1 -b v24.10.0 https://git.openwrt.org/openwrt/openwrt.git /build/openwrt.src
            mkdir -p openwrt
            cp -a /build/openwrt.src/. openwrt/
            rm -rf /build/openwrt.src
          fi
          cd openwrt
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          cat > .config <<'CFG'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_8dev_carambola2=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/build/ccache"
          CFG
          make defconfig >/dev/null
          # Warm cache → toolchain/tools already installed, so this is a fast no-op that
          # just re-verifies the stamps. Cold (cache miss) → it rebuilds, but `prepare`
          # is meant to have populated the cache first, so this should not happen.
          make -j"$(nproc)" tools/install toolchain/install

      - name: Stamp firmware version
        run: echo "Beep Revival ${{ needs.prepare.outputs.version }}" > rootfs-overlay/etc/beep-version

      - name: Build the converged image
        run: |
          set -e
          export OW=/build/openwrt SRC="$GITHUB_WORKSPACE"
          OUT=/build/openwrt/bin/targets/ath79/generic
          V="${{ needs.prepare.outputs.version }}"
          # Fresh scratch each run — the self-hosted runner is PERSISTENT, so a stale
          # /tmp/collected would otherwise pile a previous run's images into this artifact.
          rm -rf /tmp/collected; mkdir -p /tmp/collected
          echo "::group::CONVERGED build (AirPlay 1/2 runtime toggle + replaynet, no Snapcast, SSH OFF)"
          CONVERGED=1 bash "$SRC/scripts/build.sh"
          echo "::endgroup::"
          cp "$(ls "$OUT"/*8dev_carambola2-squashfs-sysupgrade.bin)" \
             "/tmp/collected/beep-revival-${V}-sysupgrade.bin"
          # NOTE: we deliberately do NOT publish the full *-initramfs-kernel.bin.
          # The first-flash RAM-boot uses the LEAN initramfs tracked in the repo
          # (images/lean-initramfs-kernel.bin) — the full initramfs OOM-panics on the
          # 64MB board, so releasing it every time was dead weight and a footgun.
          ls -la /tmp/collected/

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: /tmp/collected/beep-revival-*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # release — fan-in: sign BOTH sysupgrades, assemble assets, publish the Release.
  # ===========================================================================
  release:
    needs: [prepare, build]
    runs-on: ${{ vars.RELEASE_RUNNER && fromJSON(vars.RELEASE_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The self-hosted runner is PERSISTENT (unlike ubuntu-latest), so /tmp scratch
      # survives between runs: a leftover /tmp/usign makes the next `git clone` abort
      # ("destination path already exists"), and a stale /tmp/collected could mix in a
      # previous version's images. Wipe both before we use them. (release/ lives in the
      # workspace, which actions/checkout already cleans.)
      - name: Clean persistent-runner /tmp scratch
        run: rm -rf /tmp/usign /tmp/collected

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: images
          path: /tmp/collected

      - name: List collected images
        run: ls -la /tmp/collected/

      - name: Build usign (matches the baked-in key format)
        run: |
          git clone --depth 1 https://github.com/openwrt/usign /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build >/dev/null
          make -C /tmp/usign/build >/dev/null
          /tmp/usign/build/usign -h 2>&1 | head -1 || true

      - name: Sign the sysupgrade image
        env:
          BEEP_OTA_SEC: ${{ secrets.BEEP_OTA_SEC }}
        run: |
          [ -n "$BEEP_OTA_SEC" ] || { echo "::error::secret BEEP_OTA_SEC is not set"; exit 1; }
          umask 077; printf '%s\n' "$BEEP_OTA_SEC" > /tmp/beep-ota.sec
          V="${{ needs.prepare.outputs.version }}"
          RAW="/tmp/collected/beep-revival-${V}-sysupgrade.bin"
          SIGNED="/tmp/collected/beep-revival-${V}-sysupgrade.signed.bin"
          USIGN=/tmp/usign/build/usign bash scripts/sign-release.sh "$RAW" /tmp/beep-ota.sec "$SIGNED"
          # verify our own signature against the public key baked into the image
          /tmp/usign/build/usign -V -m "$RAW" \
            -p rootfs-overlay/etc/beep-ota.pub \
            -x <(head -2 "$SIGNED") \
            && echo "signature verifies against baked-in pubkey"
          shred -u /tmp/beep-ota.sec

      - name: Assemble release assets + checksums
        id: assets
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p release
          cp /tmp/collected/beep-revival-${V}-sysupgrade.bin        release/
          cp /tmp/collected/beep-revival-${V}-sysupgrade.signed.bin release/
          cp rootfs-overlay/etc/beep-ota.pub release/beep-ota.pub
          ( cd release && sha256sum * > SHA256SUMS )
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Beep Revival ${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          draft: ${{ github.ref_type != 'tag' }}   # manual runs land as a draft to review
          generate_release_notes: true
          files: release/*
          body: |
            **Beep Revival firmware — ${{ needs.prepare.outputs.version }}**

            Open OpenWrt-based firmware for the orphaned Beep "Dial" speaker (AR9331 / Carambola 2).

            ### One image — AirPlay 1 or 2, chosen in the app
            This is now a **single firmware** (no more separate ap1/ap2/replaynet images).
            Flash **`*-sysupgrade.signed.bin`** and pick your AirPlay mode any time in the web
            admin → **AirPlay mode** — no reflash:

            | | **AirPlay 1** (default) | **AirPlay 2** |
            |---|---|---|
            | AirPlay from iPhone / iPad / Mac | ✅ | ✅ |
            | Audio codec | ALAC — **lossless** | AAC 256k — lossy |
            | Multi-room | **replaynet** (Beep's own, sample-synced) | native AirPlay-2 grouping (Apple Home) |
            | Apple **Home** app | ❌ | ✅ |
            | CPU headroom on the AR9331 | comfortable | **thin** — can glitch under load |

            **Default is AirPlay 1** — lossless, lighter, with Beep multi-room. Switch to AirPlay 2
            in the app if you want Apple Home / native AirPlay-2 grouping.

            > **Snapcast has been retired** — `replaynet` (a small from-scratch sync engine, no
            > C++/boost) is now the multi-room engine for AirPlay 1. **TRL 4 — multi-room is still
            > being tuned;** expect occasional rough edges.

            ### Install (already on Beep Revival)
            In the device's web admin → **Update firmware**, upload
            **`*-sysupgrade.signed.bin`**. The device verifies the usign signature
            against its baked-in key before flashing. No unsigned bypass without the
            physical triple-tap.

            ### First-time flash (still on stock/cloud firmware)
            You need a 3.3 V USB-UART adapter. Follow **[docs/FLASHING-WALKTHROUGH.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/FLASHING-WALKTHROUGH.md)**.
            The walkthrough RAM-boots the **lean** image shipped in the repo
            (`images/lean-initramfs-kernel.bin`), then sysupgrades the `*-sysupgrade.bin`
            from this release. *(Do not RAM-boot a full `-initramfs-kernel.bin` — it
            OOM-panics on the 64 MB board; that's why it isn't published here.)*

            ### Verify a download
            `usign -V -m <image> -p beep-ota.pub -x <(head -2 *.signed.bin)` — or check `SHA256SUMS`.

            > ⚠️ **No warranty.** 3.3 V UART only. Never write `u-boot` or `art`. See the walkthrough's safety section.
