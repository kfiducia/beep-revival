# System audio routing for the Beep. The WM8524 is a "hardware mode" DAC with
# NO volume register, so there is no hardware mixer to turn down. We insert an
# ALSA softvol plugin that (a) does the attenuation in software and (b) exposes
# a normal "Master" mixer control — which the knob (beepd/beep-action), the web
# slider, and AirPlay (shairport mixer_control_name) all drive. One unified
# system volume instead of three disconnected ones.
pcm.!default {
	type plug
	slave.pcm "softvol"
}

pcm.softvol {
	type softvol
	slave.pcm "hw:0,0"
	control { name "Master"; card 0 }
	min_dB -60.0
	max_dB   0.0
	resolution 100
}

ctl.!default {
	type hw
	card 0
}
