# System audio routing for the Beep. The WM8524 is a "hardware mode" DAC with
# NO volume register, so there is no hardware mixer to turn down. We insert an
# ALSA softvol plugin that (a) does the attenuation in software and (b) exposes
# a normal "Master" mixer control — driven by the knob (beepd/beep-action) and the
# web slider (rpcd). AirPlay does NOT drive it: shairport is set to
# ignore_volume_control and plays full-scale into this softvol, so the knob/web are
# the single volume authority (see /etc/shairport-sync.conf for why).
pcm.!default {
	type plug
	slave.pcm "softvol"
}

pcm.softvol {
	type softvol
	slave.pcm "hw:0,0"
	control { name "Master"; card 0 }
	min_dB -60.0
	max_dB   0.0
	resolution 100
}

ctl.!default {
	type hw
	card 0
}
