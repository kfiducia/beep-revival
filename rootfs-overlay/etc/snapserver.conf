# Beep multi-room — snapserver config (used only when this Beep is the group PRIMARY).
#
# The local classic AirPlay-1 shairport writes raw PCM to /tmp/snapfifo; snapserver
# reads it here and distributes it, time-stamped, to every snapclient in the group
# (this Beep + the others), so they play sample-accurately in sync.
#
# codec=pcm on purpose: the primary is itself a 400MHz Beep also decoding AirPlay-1
# and running a snapclient — making it FLAC-encode for the LAN too would load it for
# no benefit. Uncompressed PCM is ~1.4Mbit/s/stream, a non-issue over wifi.

[stream]
source = pipe:///tmp/snapfifo?name=Beep&sampleformat=44100:16:2&codec=pcm&dryout_ms=2000
sampleformat = 44100:16:2
codec = pcm
# ~400ms end-to-end buffer: tight enough for room-to-room sync on wifi, short enough
# that AirPlay start/stop stays responsive.
buffer = 400
chunk_ms = 20

[http]
enabled = false

[tcp]
enabled = true

