// Beep AirPlay config. Name follows the device hostname (%H), so renaming the
// device in the web UI renames AirPlay too (set_name just restarts this). Audio
// goes through the ALSA "default" PCM (our softvol).
//
// Volume: the KNOB and WEB SLIDER are the sole authority (they drive the "Master"
// softvol via amixer). We deliberately IGNORE the AirPlay sender's volume — see
// ignore_volume_control below. Why: AirPlay-1 has no way to report a receiver-side
// (knob) change back to an iOS sender's slider, so if we also honoured inbound
// volume the two would fight and the level would jump every time the phone
// re-asserted its slider. One-way local control keeps it coherent. The phone's
// slider still moves on-screen but no longer changes the Beep. (True two-way sync
// needs AirPlay-2's bidirectional volume — the CPU-prohibitive path.)
general = {
	name = "%H";
	output_backend = "alsa";
	// The AR9331 (400 MHz, no FPU) can't afford soxr for clock-drift correction —
	// it pegs the core and the PCM underruns (choppy audio, strobing S/PDIF). Force
	// the cheap linear resampler. (This is the AirPlay-1/ALAC path; soxr was the
	// dominant cost here. AirPlay-2/AAC is a different story — see docs/DEV-NOTES.md.)
	interpolation = "basic";

	// Ignore the AirPlay sender's volume; play at unity and let the local "Master"
	// softvol (knob + web slider) be the only thing that attenuates. See the header.
	ignore_volume_control = "yes";
};

alsa = {
	output_device = "default";
	// No mixer_control_name: with ignore_volume_control=yes, shairport must NOT own
	// "Master" — otherwise it writes its always-max volume to the control on every
	// connect and blasts the level past whatever the knob set. It plays full-scale
	// PCM into the softvol instead; "Master" is driven only by the knob (beep-action)
	// and the web slider (rpcd).
};
