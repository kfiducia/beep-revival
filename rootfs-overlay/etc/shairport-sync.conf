// Beep AirPlay config. Name follows the device hostname (%H), so renaming the
// device in the web UI renames AirPlay too (set_name just restarts this). Audio
// goes through the ALSA "default" PCM (our softvol), and AirPlay volume is bound
// to the "Master" softvol control, so the phone's volume, the knob and the web
// slider all move the same level.
general = {
	name = "%H";
	output_backend = "alsa";
	// The AR9331 (400 MHz, no FPU) can't afford soxr for clock-drift correction —
	// it pegs the core and the PCM underruns (choppy audio, strobing S/PDIF). Force
	// the cheap linear resampler. (This is the AirPlay-1/ALAC path; soxr was the
	// dominant cost here. AirPlay-2/AAC is a different story — see docs/DEV-NOTES.md.)
	interpolation = "basic";
};

alsa = {
	output_device = "default";
	mixer_control_name = "Master";
};
